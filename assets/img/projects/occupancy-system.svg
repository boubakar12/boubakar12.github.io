<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Occupancy counter coursework prototype</title>
  <desc id="desc">A manual button counter and a separate experimental pair of light sensors are shown feeding a Cortex-M0+ occupancy counter, with UART messages read by a Python logger.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1a3a5c"/></marker></defs>
  <rect width="1200" height="600" fill="#efede8"/>
  <g font-family="monospace" fill="#433f38"><text x="64" y="68" font-size="17" letter-spacing="3">ECE 3140 · TEAM COURSEWORK</text><text x="64" y="121" font-family="Georgia,serif" font-size="38" fill="#111010">Two code paths, one occupancy counter.</text></g>
  <g fill="#f9f7f3" stroke="#b9b3a9"><rect x="64" y="207" width="246" height="106" rx="5"/><rect x="64" y="350" width="246" height="106" rx="5"/><rect x="463" y="248" width="272" height="165" rx="5"/><rect x="896" y="207" width="240" height="106" rx="5"/><rect x="896" y="350" width="240" height="106" rx="5"/></g>
  <g text-anchor="middle" font-family="monospace" fill="#1a3a5c"><text x="187" y="252" font-size="25">Buttons</text><text x="187" y="395" font-size="25">2 light sensors</text><text x="599" y="297" font-size="26">Cortex-M0+</text><text x="1016" y="252" font-size="23">Status LEDs</text><text x="1016" y="395" font-size="23">Python logger</text></g>
  <g text-anchor="middle" font-family="monospace" fill="#433f38" font-size="15"><text x="187" y="284">MANUAL COUNT PATH</text><text x="187" y="427">SEPARATE EXPERIMENT</text><text x="599" y="334">ENTRY / EXIT COUNT</text><text x="599" y="368">FRDM-KL46Z</text><text x="1016" y="284">CAPACITY THRESHOLD</text><text x="1016" y="427">USB · CSV EVENTS</text></g>
  <g stroke="#1a3a5c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M312 260h73v70h69"/><path d="M312 403h73v-73h69"/><path d="M737 330h72v-70h79"/><path d="M737 330h72v73h79"/></g>
  <text x="353" y="200" font-family="monospace" font-size="16" fill="#c8522a">GPIO INPUTS</text><path d="M64 506H1136" stroke="#b9b3a9"/><text x="64" y="547" font-family="monospace" font-size="16" fill="#433f38">SOURCE REVIEW: SENSOR AND MANUAL PATHS ARE NOT SHOWN AS A VERIFIED INTEGRATED BUILD</text>
</svg>
