<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Preemptive RTOS scheduler</title><desc id="desc">A one millisecond timer tick activates scheduling. The earliest-deadline ready task is selected, context is switched, and the task runs or returns to a blocked queue.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1a3a5c"/></marker></defs>
  <rect width="1200" height="600" fill="#efede8"/>
  <g font-family="monospace" fill="#433f38"><text x="64" y="68" font-size="17" letter-spacing="3">EMBEDDED SYSTEMS / CORTEX-M0+</text><text x="64" y="121" font-family="Georgia,serif" font-size="38" fill="#111010">A deadline drives the next decision.</text></g>
  <g stroke="#b9b3a9" fill="#f9f7f3"><rect x="64" y="221" width="222" height="128" rx="5"/><rect x="347" y="221" width="222" height="128" rx="5"/><rect x="630" y="221" width="222" height="128" rx="5"/><rect x="913" y="221" width="222" height="128" rx="5"/></g>
  <g font-family="monospace" text-anchor="middle" fill="#1a3a5c"><text x="175" y="275" font-size="27">1 ms tick</text><text x="458" y="275" font-size="27">Ready queue</text><text x="741" y="275" font-size="27">Switch</text><text x="1024" y="275" font-size="27">Run task</text></g>
  <g font-family="monospace" text-anchor="middle" font-size="15" fill="#433f38"><text x="175" y="311">TIMER INTERRUPT</text><text x="458" y="311">EARLIEST DEADLINE</text><text x="741" y="311">SAVE / RESTORE</text><text x="1024" y="311">PREEMPTIBLE</text></g>
  <g stroke="#1a3a5c" fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M288 285h51"/><path d="M571 285h51"/><path d="M854 285h51"/><path d="M1024 352v88H458v-82"/></g>
  <text x="592" y="420" font-family="monospace" font-size="16" fill="#c8522a">BLOCK · WAKE · RESCHEDULE</text>
  <path d="M64 506H1135" stroke="#b9b3a9"/><text x="64" y="547" font-family="monospace" font-size="16" fill="#433f38">C + ARM ASSEMBLY · CONTEXT SWITCHING · SPIN / BLOCKING LOCKS</text>
</svg>
