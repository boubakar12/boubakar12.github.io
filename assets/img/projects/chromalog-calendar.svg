<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ChromaLog weekly planner</title>
  <desc id="desc">An illustrative weekly hour grid with color-coded activity blocks and a compact activity palette.</desc>
  <rect width="1200" height="600" fill="#efede8"/>
  <text x="64" y="72" fill="#433f38" font-family="monospace" font-size="16" letter-spacing="3">CHROMALOG / PERSONAL PLANNING</text>
  <text x="64" y="126" fill="#111010" font-family="Georgia,serif" font-size="38">Give the week a visible shape.</text>
  <rect x="64" y="164" width="1072" height="362" rx="8" fill="#faf9f6" stroke="#c9c4b9"/>
  <rect x="64" y="164" width="1072" height="44" rx="8" fill="#e5e1d8"/>
